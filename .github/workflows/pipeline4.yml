name:
on: 
    push:
      branches:
         - main
    pull_request:
        branches:
          - main
jobs:
     trigger:
         runs-on: ubuntu-latest
         steps:
         - name: going to start pipeline
           uses: actions/checkout@v4
         - name: printing Folders 
           run: ls
         - name: Setup Node 
           uses: actions/setup-node@v3 
           with:
             node-version: '20.x'
         - name: Install dependencies 
           run: npm ci